<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>RingFlip</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0b0d1a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}.hide{display:none!important}
h1{font-size:52px;margin:0;letter-spacing:1px;background:linear-gradient(90deg,#7c5cff,#2ecc8f,#ffd23f);-webkit-background-clip:text;color:transparent}
.b{border:0;border-radius:16px;padding:14px 22px;font-size:18px;font-weight:800;color:#fff;background:#7c5cff;min-width:220px;cursor:pointer}.b.s{background:#22284a}.b.d{background:linear-gradient(90deg,#ff7a59,#ffb648)}
.m{color:#9aa3c7;font-size:14px}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;font-size:20px;pointer-events:none}
.wd{border-radius:16px;padding:12px;margin:10px 0;text-align:left}.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.lc{border:0;border-radius:12px;padding:10px 0;font-weight:800;font-size:18px;color:#fff;cursor:pointer;background:#ffffff22}.lc[disabled]{opacity:.35}.lc small{display:block;font-size:11px;color:#ffd23f}
.sk{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:340px}.sw{width:54px;height:54px;border-radius:50%;border:3px solid transparent;cursor:pointer;position:relative;font-size:11px;display:flex;align-items:center;justify-content:center}.sw.on{border-color:#fff}.sw.lock{opacity:.35}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2ecc8f;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.3s}</style></head><body>
<canvas id="c"></canvas><div id="hud" class="hide"><span id="hs">0</span><span id="ht">60</span></div>
<div id="title" class="ui"><h1>RingFlip</h1><div class="m">Tap anywhere to flip rings. Dodge spikes, grab gems.<br>Survive 60 seconds.</div>
<button class="b" id="bLevels" style="background:linear-gradient(90deg,#7c5cff,#2ecc8f)">🗺 Levels</button><button class="b" id="bPlay">∞ Endless</button><button class="b d" id="bDaily">☀ Daily Challenge</button>
<div class="m" id="stats"></div><button class="b s" id="bSkins">🎨 Skins</button><button class="b s" id="bSound" style="min-width:auto">🔊 Sound: on</button></div>
<div id="skins" class="ui hide"><h2>Skins</h2><div class="m" id="gemtot"></div><div class="sk" id="sklist"></div><button class="b s" id="bBack">Back</button></div>
<div id="lv" class="ui hide" style="justify-content:flex-start;overflow:auto;padding-top:30px"><h2 style="margin:0">Levels</h2><div class="m" id="lvstars"></div><div id="lvlist" style="width:100%;max-width:380px"></div><button class="b s" id="bLvBack">Back</button></div>
<div id="goal" style="position:fixed;top:48px;left:0;right:0;text-align:center;font-weight:700;color:#cfd3f5;pointer-events:none" class="hide"></div>
<div id="over" class="ui hide"><h2 id="oT"></h2><div style="font-size:48px;font-weight:900" id="oS"></div><div class="m" id="oM"></div>
<button class="b" id="bNext" style="background:#2ecc8f">Next level ▶</button><button class="b" id="bAgain">↻ Play again</button><button class="b s" id="bShare">📋 Share result</button><button class="b s" id="bHome">Home</button></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const SKINS=[['Mint','#2ecc8f',0],['Sun','#ffd23f',25],['Coral','#ff5c7a',60],['Sky','#4aa3ff',120],['Neon','#ff4df0',200],['Ghost','#ffffff',350],['Rainbow','rainbow',600]];
const P=Object.assign({best:0,gems:0,skin:0,sound:1,dStreak:0,dLast:'',dBest:{},played:0},JSON.parse(localStorage.getItem('ringflip')||'{}'));const save=()=>localStorage.setItem('ringflip',JSON.stringify(P));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let W,H,DPR;function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',rs);rs();
let AC;function beep(f,d=.08,type='sine',v=.15){if(!P.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

const DEF={rings:2,speed:2.2,accel:.045,spawn:1.0,spawnMin:.32,gemP:.28,dbl:20,mov:0,boost:0,rev:0,boss:0,theme:0};
const THEMES=[{bg:'#0b0d1a',ring:'#1d2245',on:'#3a3f78',sp:'#ff5c7a'},{bg:'#06140f',ring:'#123527',on:'#1f6b4c',sp:'#ff5c7a'},{bg:'#1a0c08',ring:'#3d1d12',on:'#7a3a1f',sp:'#ff3d6e'},{bg:'#0d0619',ring:'#2a1450',on:'#5a2fa8',sp:'#ff4df0'}];
const WORLDS=[['Neon Meadow','#1f6b4c'],['Sunset Rush','#a8471f'],['Deep Void','#5a2fa8']];
const LV=[
{nm:'First Flip',g:['time',20],speed:1.8,accel:.02,spawn:1.1,dbl:99,st:[2,4],tip:'Tap to flip rings. Survive!'},
{nm:'Gem Rush',g:['gems',6],lim:45,speed:1.9,accel:.02,gemP:.45,dbl:99,st:[10,20],tip:'Collect 6 gems'},
{nm:'Double Trouble',g:['dodge',25],lim:60,speed:2,accel:.025,dbl:0,st:[2,5],tip:'Paired spikes! Dodge 25'},
{nm:'Drifters',g:['time',30],speed:2.1,accel:.03,mov:.3,st:[3,6],tip:'Some spikes move'},
{nm:'Boost Lane',g:['time',30],speed:2.2,boost:.12,dbl:15,st:[3,6],tip:'⚡ Pads give a speed burst + points'},
{nm:'Turnabout',g:['gems',10],lim:60,speed:2.2,rev:.08,gemP:.35,st:[10,20],tip:'🔄 Reverse zones flip your direction'},
{nm:'Chaos Loop',g:['dodge',40],lim:60,speed:2.3,mov:.4,rev:.07,dbl:10,st:[3,6],tip:'Movers + reversals. Dodge 40'},
{nm:'Afterburner',g:['time',40],speed:2.6,accel:.03,boost:.12,rev:.06,dbl:5,st:[4,8],tip:'Fast. Very fast.'},
{nm:'Third Ring',g:['time',30],rings:3,speed:2,accel:.03,st:[3,6],tip:'A third ring! Taps cycle inward'},
{nm:'Void Gems',g:['gems',12],lim:60,rings:3,speed:2.1,mov:.35,gemP:.4,st:[10,20],tip:'Collect 12 gems'},
{nm:'Gauntlet',g:['dodge',50],lim:60,rings:3,speed:2.3,mov:.4,boost:.08,rev:.06,dbl:5,st:[3,6],tip:'Everything at once. Dodge 50'},
{nm:'The Core',g:['time',45],rings:3,speed:2.2,accel:.02,boss:1,gemP:.2,st:[3,6],tip:'👾 BOSS: find the gap in each wave!'}
].map((l,i)=>Object.assign({},DEF,{accel:.025,spawn:.95,theme:1+Math.floor(i/4),n:i},l));
let G=null,LEN=60,TS=1;P.lv=P.lv||{};
function start(daily,lvl){const L=lvl!=null?LV[lvl]:DEF;const seed=lvl!=null?hash('rf-level-'+lvl):daily?hash('ringflip-'+today()):(Math.random()*1e9)|0;
G={daily,lvl,L,seed,r:rng(seed),t:0,ang:-Math.PI/2,dir:1,ring:L.rings-1,obs:[],parts:[],score:0,gems:0,dodged:0,combo:0,shake:0,next:1,wave:3,alive:true,flips:0,pulse:0,boostT:0,flash:0};
LEN=lvl!=null?(L.g[0]=='time'?L.g[1]:L.lim):60;
['title','over','skins','lv'].forEach(i=>$(i).classList.add('hide'));$('hud').classList.remove('hide');$('goal').classList.toggle('hide',lvl==null);beep(520,.1)}
function radii(){const R=Math.min(W,H)*.38,n=G?G.L.rings:2;return n==3?[R*.48,R*.74,R]:[R*.62,R]}
function flip(){if(!G||!G.alive)return;const n=G.L.rings;G.ring=(G.ring-1+n)%n;G.flips++;G.pulse=1;beep(380+G.ring*140,.06,'triangle');burst(pos(),skinCol(),6,2)}
function pos(){const r=radii()[G.ring];return[W/2+Math.cos(G.ang)*r,H/2+Math.sin(G.ang)*r]}
function skinCol(){const c=SKINS[P.skin][1];return c=='rainbow'?`hsl(${(performance.now()/5)%360},90%,65%)`:c}
function burst([px,py],col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp+1;G.parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col})}}
function speed(){return(G.L.speed+G.t*G.L.accel)*(G.boostT>0?1.6:1)}
function goalTxt(){const L=G.L,[k,v]=L.g;return k=='time'?`Survive ${v}s`:k=='gems'?`💎 ${G.gems}/${v}`:`Dodge ${G.dodged}/${v}`}
function step(dt){const L=G.L,r=G.r,n=L.rings;G.t+=dt;G.ang+=speed()*dt*G.dir;G.next-=dt;G.boostT-=dt;
 if(G.next<=0){G.next=Math.max(L.spawnMin,L.spawn-G.t*.011)*(.7+r()*.6);const ahead=G.ang+G.dir*(1.6+r()*1.2);const q=r();let ty=q<L.gemP?'gem':q<L.gemP+L.boost?'boost':q<L.gemP+L.boost+L.rev?'rev':'spike';
  const ring=Math.floor(r()*n);const fair=(a,rg)=>{for(let i=0;i<n;i++){if(i==rg)continue;if(!G.obs.some(q=>q.ty=='spike'&&q.ring==i&&Math.abs(q.a-a)<.5))return true}return false};if(ty=='spike'&&!fair(ahead,ring))ty='gem';const o={a:ahead,ring,ty,born:G.t,va:0};if(ty=='spike'&&r()<L.mov)o.va=(r()<.5?-1:1)*(.4+r()*.5);if(ty=='rev')o.ring=-1;G.obs.push(o);
  if(ty=='spike'&&G.t>L.dbl&&r()<.25){const a2=ahead+G.dir*.6,r2=(ring+1+Math.floor(r()*(n-1)))%n;if(fair(a2,r2))G.obs.push({a:a2,ring:r2,ty:'spike',born:G.t,va:0})}}
 if(L.boss){G.wave-=dt;if(G.wave<=0){G.wave=Math.max(1.6,2.8-G.t*.025);const gap=Math.floor(r()*n),a=G.ang+G.dir*2.3;G.obs.forEach(q=>{if(q.ty=='spike'&&Math.abs(q.a-a)<.7&&(q.ring==gap||q.va))q.dead=1});for(let i=0;i<n;i++)if(i!=gap)G.obs.push({a,ring:i,ty:'spike',born:G.t,va:0,wall:1});G.flash=1;beep(200,.15,'square',.08)}}
 for(const o of G.obs){if(o.dead)continue;o.a+=o.va*dt;const d=(G.ang-o.a)*G.dir;
  if(Math.abs(d)<.11&&(o.ring==G.ring||o.ring==-1)){
   if(o.ty=='gem'){o.dead=1;G.gems++;G.combo++;G.score+=10*Math.min(5,1+Math.floor(G.combo/3));beep(880+G.combo*40,.07);burst(pos(),'#ffd23f',14,4)}
   else if(o.ty=='boost'){o.dead=1;G.boostT=2;G.score+=5;G.shake=5;beep(1200,.12,'square',.06);burst(pos(),'#4aa3ff',20,5)}
   else if(o.ty=='rev'){o.dead=1;G.dir*=-1;G.score+=3;beep(300,.1,'triangle');burst(pos(),'#ffffff',18,4);for(const q of G.obs)if(!q.dead&&(G.ang-q.a)*G.dir>-0.15&&(G.ang-q.a)*G.dir<.6)q.dead=1}
   else{die();return}}
  if(d>.6&&!o.dead){if(o.ty=='spike'){G.score+=1;G.dodged++}o.dead=1}if(Math.abs(d)>7)o.dead=1}
 G.obs=G.obs.filter(o=>!o.dead);
 if(G.lvl!=null){const[k,v]=L.g;if((k=='gems'&&G.gems>=v)||(k=='dodge'&&G.dodged>=v)||(k=='time'&&G.t>=v))return end(true);if(G.t>=LEN)return end(false,'⏱ Out of time')}else if(G.t>=LEN)end(true)}
function die(){G.alive=false;G.shake=18;beep(120,.35,'sawtooth',.2);burst(pos(),'#ff5c7a',40,6);G.combo=0;setTimeout(()=>end(false),700)}
function end(won,why){if(G.over)return;G.over=1;G.alive=false;if(won){G.score+=100;beep(784,.2)}const s=G.score;P.gems+=G.gems;P.played++;let nb=false,dmsg='',lmsg='';
 if(G.lvl!=null){const L=G.L;let st=0;if(won){const m=L.g[0]=='gems'?LEN-G.t:G.gems;st=1+(m>=L.st[0])+(m>=L.st[1]);const prev=P.lv[L.n]||0;P.lv[L.n]=Math.max(prev,st)}
  lmsg=won?`${'⭐'.repeat(st)}${'☆'.repeat(3-st)}<br>${L.g[0]=='gems'?`3★: finish with ${L.st[1]}s left`:`3★: grab ${L.st[1]} gems`}`:(why||'Try again!')}
 else{nb=s>P.best;if(nb)P.best=s;if(G.daily){const k=today();if(P.dLast!==k){const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');P.dStreak=P.dLast===yk?P.dStreak+1:1;P.dLast=k}P.dBest[k]=Math.max(P.dBest[k]||0,s);dmsg=` · Daily streak ☀${P.dStreak}`}}
 const unl=SKINS.filter(k=>k[2]>P.gems-G.gems&&k[2]<=P.gems);save();G.res={s,won,t:Math.min(LEN,G.t)|0,gems:G.gems,daily:G.daily,lvl:G.lvl,stars:P.lv[G.lvl]};
 $('hud').classList.add('hide');$('goal').classList.add('hide');$('over').classList.remove('hide');
 $('oT').textContent=G.lvl!=null?(won?`🎉 Level ${G.lvl+1} clear!`:`💥 Level ${G.lvl+1}`):won?'🎉 Survived!':'💥 Crashed';$('oS').textContent=s;
 $('bNext').classList.toggle('hide',!(G.lvl!=null&&won&&G.lvl<LV.length-1));
 $('oM').innerHTML=`${lmsg?lmsg+'<br>':''}${nb?'🏆 New personal best!<br>':''}Time ${G.res.t}s · 💎${G.gems}${G.lvl==null?' · Best '+P.best:''}${dmsg}${unl.length?'<br>🎨 Unlocked skin: '+unl.map(k=>k[0]).join(', '):''}`}
function shareStr(){const r=G.res,bl=Math.round(r.t/LEN*10);const mode=r.lvl!=null?`Level ${r.lvl+1} ${'⭐'.repeat(r.won?P.lv[r.lvl]:0)}`:r.daily?'Daily '+today():'Endless';return`RingFlip ${mode} ${r.won?'✅':'💥'}\n${'🟩'.repeat(bl)}${'⬛'.repeat(10-bl)} ${r.t}s\n💎${r.gems}  ⭐${r.s}${r.daily?'  ☀'+P.dStreak:''}`}
let last=performance.now(),acc=0;function loop(n){let dt=Math.min(.1,(n-last)/1000)*TS;last=n;if(G&&G.alive&&!G.over){acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;if(!G.alive)break}}draw(dt);requestAnimationFrame(loop)}
function draw(dt){const T=THEMES[G?G.L.theme:0];x.fillStyle=T.bg;x.fillRect(0,0,W,H);x.save();if(G&&G.shake>0){x.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);G.shake*=.88}
 const R=radii(),cx=W/2,cy=H/2,t=performance.now()/1000;
 if(G&&G.L.boss){const pr=Math.min(1,G.t/G.L.g[1]);x.beginPath();x.arc(cx,cy,R[0]*.55+Math.sin(t*6)*4+G.flash*10,0,7);x.fillStyle=`hsl(${300-G.flash*60},80%,${45+G.flash*20}%)`;x.shadowBlur=40;x.shadowColor='#ff4df0';x.fill();x.shadowBlur=0;G.flash*=.9;
  x.fillStyle='#000a';x.beginPath();x.arc(cx-12,cy-6,6,0,7);x.arc(cx+12,cy-6,6,0,7);x.fill();x.strokeStyle='#ffffff55';x.lineWidth=6;x.beginPath();x.arc(cx,cy,R[0]*.55+12,-Math.PI/2,-Math.PI/2+6.283*(1-pr));x.stroke()}
 R.forEach((r,i)=>{x.beginPath();x.arc(cx,cy,r,0,7);x.strokeStyle=G&&G.ring==i&&G.alive?T.on:T.ring;x.lineWidth=G&&G.ring==i?10:6;x.stroke()});
 if(!G){x.beginPath();const a=t*2;x.arc(cx+Math.cos(a)*R[1],cy+Math.sin(a)*R[1],14,0,7);x.fillStyle=skinCol();x.shadowBlur=20;x.shadowColor=x.fillStyle;x.fill();x.restore();return}
 for(const o of G.obs){const k=Math.min(1,(G.t-o.born)*4);if(o.ty=='rev'){x.save();x.strokeStyle='#ffffffaa';x.lineWidth=4;x.setLineDash([6,6]);x.beginPath();x.moveTo(cx+Math.cos(o.a)*(R[0]-20),cy+Math.sin(o.a)*(R[0]-20));x.lineTo(cx+Math.cos(o.a)*(R[R.length-1]+20),cy+Math.sin(o.a)*(R[R.length-1]+20));x.stroke();
   x.setLineDash([]);x.fillStyle='#fff';x.font='20px system-ui';x.textAlign='center';x.fillText('🔄',cx+Math.cos(o.a)*(R[R.length-1]+38),cy+Math.sin(o.a)*(R[R.length-1]+38)+7);x.restore();continue}
  const r=R[o.ring],px=cx+Math.cos(o.a)*r,py=cy+Math.sin(o.a)*r;x.save();x.translate(px,py);x.scale(k,k);
  if(o.ty=='gem'){x.rotate(t*3);x.fillStyle='#ffd23f';x.shadowBlur=15;x.shadowColor='#ffd23f';x.beginPath();x.moveTo(0,-11);x.lineTo(9,0);x.lineTo(0,11);x.lineTo(-9,0);x.fill()}
  else if(o.ty=='boost'){x.rotate(o.a+Math.PI/2*G.dir);x.fillStyle='#4aa3ff';x.shadowBlur=18;x.shadowColor='#4aa3ff';x.beginPath();x.moveTo(12,0);x.lineTo(-6,-10);x.lineTo(-2,0);x.lineTo(-6,10);x.fill()}
  else{x.rotate(o.a+(o.va?t*6:0));x.fillStyle=o.va?'#ffb648':T.sp;x.shadowBlur=12;x.shadowColor=x.fillStyle;x.beginPath();for(let i=0;i<8;i++){const rr=i%2?7:16,aa=i*Math.PI/4;x.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}x.fill()}x.restore()}
 if(G.alive){const[px,py]=pos(),s=14+G.pulse*6;G.pulse*=.85;x.beginPath();x.arc(px,py,s,0,7);x.fillStyle=skinCol();x.shadowBlur=G.boostT>0?45:25;x.shadowColor=G.boostT>0?'#4aa3ff':x.fillStyle;x.fill();x.shadowBlur=0;
  for(let i=1;i<(G.boostT>0?10:6);i++){const a=G.ang-G.dir*i*.06;const r=R[G.ring];x.globalAlpha=.25-i*.025;x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.max(2,12-i),0,7);x.fill()}x.globalAlpha=1}
 x.shadowBlur=0;for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l-=.025;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.fillRect(p.x-2,p.y-2,4,4)}x.globalAlpha=1;G.parts=G.parts.filter(p=>p.l>0);
 if(G.combo>=3&&G.alive&&!G.L.boss){x.fillStyle='#ffd23f';x.font='800 22px system-ui';x.textAlign='center';x.fillText('COMBO x'+Math.min(5,1+Math.floor(G.combo/3)),cx,cy+8)}
 x.restore();$('hs').textContent='⭐ '+G.score;$('ht').textContent=Math.max(0,Math.ceil(LEN-G.t))+'s';if(G.lvl!=null)$('goal').textContent=`L${G.lvl+1} · ${goalTxt()}${G.t<3?' — '+G.L.tip:''}`}
function unlocked(i){return i==0||(P.lv[i-1]||0)>0}
function levels(){G=null;['title','over','hud','goal'].forEach(i=>$(i).classList.add('hide'));$('lv').classList.remove('hide');const tot=Object.values(P.lv).reduce((a,b)=>a+b,0);$('lvstars').textContent=`⭐ ${tot}/${LV.length*3} stars`;
 $('lvlist').innerHTML=WORLDS.map(([wn,wc],w)=>`<div class="wd" style="background:linear-gradient(135deg,${wc},#0008)"><b>World ${w+1}: ${wn}</b><div class="lg">${LV.slice(w*4,w*4+4).map(l=>{const u=unlocked(l.n),st=P.lv[l.n]||0;return`<button class="lc" data-l="${l.n}" ${u?'':'disabled'} title="${l.nm}">${u?(l.boss?'👾':l.n+1):'🔒'}<small>${u?'★'.repeat(st)+'☆'.repeat(3-st):''}</small></button>`}).join('')}</div></div>`).join('');
